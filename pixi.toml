[workspace]
name = "aiflow_env"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]

[activation.env]
# The conda-forge tensorflow build (pulled in by grace-tensorpotential) has an
# executable-stack flag that glibc >= 2.41 refuses to load. Ignored by older glibc.
GLIBC_TUNABLES = "glibc.rtld.execstack=2"

[dependencies]
python = "3.12.*"

# Jupyter / widgets
anywidget = "*"
ipykernel = "*"
ipython = "*"
ipytree = "*"
ipywidgets = "*"
jupyterlab = "*"
nglview = "*"
traitlets = "*"

# Bundle-only extras on top of what aiflow_nodes brings in
psycopg2 = "*"  # PostgreSQL driver used by SQLAlchemy (aiflow database settings)
atomistics = ">=0.3"
pymatgen-analysis-defects = "==2026.3.20"
pysqa = "==0.4.1"
openai = "==2.29.0"

# Testing
coverage = "*"
pytest = ">=8"
deptry = ">=0.25.1,<0.26"

# Development
pre-commit = "*"
# Builds the aiflow.gui widget (TypeScript, aiflow/frontend) with npm.
nodejs = "24.*"  # LTS

# Installs the conda dependencies of aiflow_nodes (its [tool.pixi.package]
# run-dependencies, including the atomistics stack and the linux-only gpaw)
# without building the package; the package itself is the editable PyPI
# install below.
[dev]
aiflow_nodes = { path = "./aiflow_nodes" }

[constraints]
fastapi = ">=0.122.0"
pillow = "<13.0.0"

[pypi-dependencies]
aiflow = { path = "./aiflow", editable = true, extras = ["all", "dev"] }
aiflow_nodes = { path = "./aiflow_nodes", editable = true }
aiflow_evals = { path = "./aiflow/evals", editable = true }

[tasks]
lab = "jupyter lab"

# aiflow.gui widget: compiles aiflow/frontend into aiflow/src/aiflow/gui/static.
gui-install = { cmd = "npm install", cwd = "aiflow/frontend" }
gui-build = { cmd = "npm run build", cwd = "aiflow/frontend", depends-on = ["gui-install"] }
gui-dev = { cmd = "npm run dev", cwd = "aiflow/frontend", depends-on = ["gui-install"] }
gui-test = { cmd = "npm test", cwd = "aiflow/frontend", depends-on = ["gui-install"] }

